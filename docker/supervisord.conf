[supervisord]
nodaemon=true
user=root
logfile=/app/storage/logs/supervisord.log
pidfile=/tmp/supervisord.pid

; ── Web (na 127.0.0.1 mapované cez compose; v kontajneri 0.0.0.0:3050) ──
[program:web]
command=php artisan serve --host=0.0.0.0 --port=3050
directory=/app
autostart=true
autorestart=true
environment=PHP_CLI_SERVER_WORKERS="4"
stdout_logfile=/app/storage/logs/web.log
stderr_logfile=/app/storage/logs/web.err.log

; ── Queue worker (jeden, serializuje zápisy pod rate-limitom) ──
[program:queue]
command=php artisan queue:work --tries=3 --max-time=3600 --sleep=1
directory=/app
autostart=true
autorestart=true
stopwaitsecs=60
stdout_logfile=/app/storage/logs/queue.log
stderr_logfile=/app/storage/logs/queue.err.log

; ── Scheduler (kampane, reconciliation, čistky, heartbeat) ──
[program:scheduler]
command=php artisan schedule:work
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/storage/logs/scheduler.log
stderr_logfile=/app/storage/logs/scheduler.err.log
